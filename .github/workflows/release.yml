# Publication d'une version : pousser un tag vX.Y.Z crée la release GitHub.
#   git tag -a v1.0.0 -m "QuizLab 1.0.0" && git push origin v1.0.0
# Toute la CI (ci.yml) doit passer ; un tag avec suffixe (v1.1.0-beta.1)
# est publié comme pré-version.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Archive du frontend compilé
        run: cd dist && zip -r "../quizlab-frontend-${GITHUB_REF_NAME}.zip" .
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" \
            --title "QuizLab ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag $prerelease \
            "quizlab-frontend-${GITHUB_REF_NAME}.zip"
