<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">QuizLab</title>
  <desc id="desc">Quiz illustrés, parties solo chronométrées et parties en direct avec toute la classe.</desc>
  <defs>
    <linearGradient id="bubble" x1="4" y1="4" x2="60" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6272f2"/>
      <stop offset="1" stop-color="#3343b0"/>
    </linearGradient>
    <!-- Page de cahier : lignes bleutées régulières. -->
    <pattern id="lines" width="1280" height="32" patternUnits="userSpaceOnUse">
      <line x1="0" y1="31.5" x2="1280" y2="31.5" stroke="#4a5bd4" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#28200f" flood-opacity=".22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#28200f" flood-opacity=".12"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Fond cahier -->
    <rect width="1280" height="400" fill="#f6f3ec"/>
    <rect width="1280" height="400" fill="url(#lines)"/>
    <line x1="84" y1="0" x2="84" y2="400" stroke="#ef6a3f" stroke-opacity=".35" stroke-width="2"/>

    <!-- Taches de couleur douces -->
    <circle cx="1130" cy="40" r="170" fill="#4a5bd4" opacity=".08"/>
    <circle cx="760" cy="410" r="120" fill="#ef6a3f" opacity=".08"/>

    <!-- Logo + nom -->
    <g transform="translate(128 78) scale(1.5)">
      <path fill="url(#bubble)" d="M20 4h24a16 16 0 0 1 16 16v16a16 16 0 0 1-16 16H27L15.6 60.8c-1.3 1-3.1.1-3.1-1.5v-8.8A16 16 0 0 1 4 36V20A16 16 0 0 1 20 4z"/>
      <circle cx="29" cy="27" r="11" fill="none" stroke="#fff" stroke-width="6"/>
      <path fill="none" stroke="#ffc445" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M32 32l5.5 5.5L48.5 26"/>
      <path fill="#fff" opacity=".9" d="M50 6.5l1.4 3.9 3.9 1.4-3.9 1.4-1.4 3.9-1.4-3.9-3.9-1.4 3.9-1.4z"/>
    </g>
    <text x="238" y="150" font-family="Fredoka, 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" font-size="84" font-weight="600" letter-spacing="-2" fill="#1d2233">Quiz<tspan fill="#ef6a3f">Lab</tspan></text>

    <text font-family="'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#555d70">
      <tspan x="130" y="222">Des quiz corrigés et expliqués,</tspan>
      <tspan x="130" y="258">à faire seul ou en direct avec toute la classe.</tspan>
    </text>

    <!-- Pastilles des modes de jeu -->
    <g font-family="'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700">
      <g transform="translate(130 296)">
        <rect width="170" height="44" rx="22" fill="#4a5bd4" fill-opacity=".1" stroke="#4a5bd4" stroke-opacity=".25"/>
        <circle cx="26" cy="22" r="9" fill="none" stroke="#3343b0" stroke-width="2.5"/>
        <path d="M26 17v5l3 2" fill="none" stroke="#3343b0" stroke-width="2.5" stroke-linecap="round"/>
        <text x="46" y="29" fill="#3343b0">Solo chrono</text>
      </g>
      <g transform="translate(314 296)">
        <rect width="138" height="44" rx="22" fill="#ef6a3f" fill-opacity=".12" stroke="#ef6a3f" stroke-opacity=".3"/>
        <circle cx="25" cy="22" r="6" fill="#c24a20"/>
        <circle cx="25" cy="22" r="11" fill="none" stroke="#c24a20" stroke-opacity=".35" stroke-width="2.5"/>
        <text x="45" y="29" fill="#c24a20">En direct</text>
      </g>
      <g transform="translate(466 296)">
        <rect width="134" height="44" rx="22" fill="#1a8f62" fill-opacity=".1" stroke="#1a8f62" stroke-opacity=".28"/>
        <path d="M25 11l2.6 7.4L35 21l-7.4 2.6L25 31l-2.6-7.4L15 21l7.4-2.6z" fill="#1a8f62"/>
        <text x="44" y="29" fill="#1a8f62">Quiz IA</text>
      </g>
    </g>

    <!-- Carte de question, légèrement inclinée -->
    <g transform="translate(740 62) rotate(-3 220 140)">
      <rect width="440" height="286" rx="24" fill="#fff" stroke="#e5ded0" filter="url(#shadow)"/>

      <!-- En-tête : PIN + chrono -->
      <rect x="24" y="22" width="118" height="34" rx="17" fill="#efeadf"/>
      <text x="83" y="45" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#555d70">PIN 482 915</text>
      <circle cx="394" cy="39" r="21" fill="none" stroke="#efeadf" stroke-width="6"/>
      <path d="M394 18a21 21 0 1 1-19.2 29.6" fill="none" stroke="#e0a100" stroke-width="6" stroke-linecap="round"/>
      <text x="394" y="46" text-anchor="middle" font-family="Fredoka, 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" font-size="18" font-weight="600" fill="#1d2233">12</text>

      <text x="24" y="104" font-family="Fredoka, 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" font-size="25" font-weight="600" fill="#1d2233">Quelle planète est la plus</text>
      <text x="24" y="136" font-family="Fredoka, 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" font-size="25" font-weight="600" fill="#1d2233">proche du Soleil ?</text>

      <!-- Tuiles de réponse : mêmes couleurs et formes que dans l'app -->
      <g font-family="'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">
        <g transform="translate(24 158)" opacity=".35">
          <rect width="190" height="46" rx="12" fill="#e21b3c"/>
          <path d="M26 13l11 20H15z" fill="#fff"/>
          <text x="50" y="30">Vénus</text>
        </g>
        <g transform="translate(226 158)">
          <rect width="190" height="46" rx="12" fill="#1368ce" filter="url(#soft)"/>
          <rect x="3" y="3" width="184" height="40" rx="10" fill="none" stroke="#fff" stroke-width="3"/>
          <path d="M26 11l11 12-11 12-11-12z" fill="#fff"/>
          <text x="50" y="30">Mercure</text>
          <circle cx="166" cy="23" r="12" fill="#fff"/>
          <path d="M160 23l4 4 8-8" fill="none" stroke="#1368ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(24 216)" opacity=".35">
          <rect width="190" height="46" rx="12" fill="#c68a00"/>
          <circle cx="26" cy="23" r="10" fill="#fff"/>
          <text x="50" y="30">Mars</text>
        </g>
        <g transform="translate(226 216)" opacity=".35">
          <rect width="190" height="46" rx="12" fill="#26890c"/>
          <rect x="17" y="14" width="18" height="18" rx="2" fill="#fff"/>
          <text x="50" y="30">Terre</text>
        </g>
      </g>
    </g>

    <!-- Badge de points -->
    <g transform="translate(1088 312) rotate(6)" filter="url(#soft)">
      <rect width="138" height="48" rx="24" fill="#1d2233"/>
      <path d="M26 13l3 6.5 7 .8-5.2 4.8 1.4 7-6.2-3.5-6.2 3.5 1.4-7-5.2-4.8 7-.8z" fill="#ffc445"/>
      <text x="46" y="31" font-family="Fredoka, 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" font-size="20" font-weight="600" fill="#fff">+ 940</text>
    </g>
  </g>
</svg>
