doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        # Un mapping par bounded context : les entités vivent dans <Contexte>/Domain/Model.
        mappings:
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain/Model'
                prefix: 'App\Identity\Domain\Model'
                alias: Identity
            Quiz:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Quiz/Domain/Model'
                prefix: 'App\Quiz\Domain\Model'
                alias: Quiz
            Game:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Game/Domain/Model'
                prefix: 'App\Game\Domain\Model'
                alias: Game
            Live:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Live/Domain/Model'
                prefix: 'App\Live\Domain\Model'
                alias: Live
            Access:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Access/Domain/Model'
                prefix: 'App\Access\Domain\Model'
                alias: Access
            Ai:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Ai/Domain/Model'
                prefix: 'App\Ai\Domain\Model'
                alias: Ai

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
