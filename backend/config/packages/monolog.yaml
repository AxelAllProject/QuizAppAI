monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        # Journal d'audit : actions sensibles de l'API (écritures, refus d'accès, limites atteintes).
        # Injecté avec « LoggerInterface $auditLogger » (voir Shared/UI/Http/AuditLogListener).
        - audit
        # Appels au service de génération par IA (Groq) : erreurs et réponses inexploitables.
        - ai

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            # Fichier séparé, plus lisible que dev.log pour suivre qui a fait quoi.
            audit:
                type: stream
                path: "%kernel.logs_dir%/audit_%kernel.environment%.log"
                level: info
                channels: [audit, ai]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            # Le handler principal ne garde que les erreurs : l'audit a son propre flux, dès le niveau info.
            audit:
                type: stream
                path: php://stderr
                level: info
                channels: [audit, ai]
                formatter: monolog.formatter.json
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
