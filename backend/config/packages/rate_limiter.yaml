framework:
    rate_limiter:
        # L'API Groq est gratuite mais quotée en débit : on protège le quota commun d'un usage abusif
        # (15 générations par heure et par compte, largement assez pour préparer des quiz).
        ai_quiz_generation:
            policy: sliding_window
            limit: 15
            interval: '1 hour'

        # Protège /api/login contre le bourrage de mot de passe (par adresse IP).
        login_attempts:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'

        # Complète la limite par IP : un attaquant qui change d'adresse à chaque essai reste
        # limité sur le compte visé. Seuls les échecs comptent, et une connexion réussie remet à zéro.
        login_failures_per_account:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'

        # Enregistrement des parties solo (par compte) : empêche de noyer les classements.
        quiz_sessions:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'

        # Protège /api/register contre la création massive de comptes (par adresse IP).
        registration_attempts:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

        # Suppression du compte : le mot de passe demandé ne doit pas se tester en boucle avec
        # un jeton volé. Seuls les échecs comptent (par compte).
        account_deletion_failures:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'

        # « Mot de passe oublié » : route ouverte sans jeton, qui déclenche un envoi d'e-mail.
        # Sans limite, elle servirait à inonder la boîte de quelqu'un (par adresse IP).
        password_reset_requests:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

        # Confirmation du lien reçu : empêche de balayer les jetons de réinitialisation (par adresse IP).
        password_reset_attempts:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'

        # Modification du profil : le mot de passe actuel demandé ne doit pas se tester en boucle
        # avec un jeton volé. Seuls les échecs comptent (par compte).
        profile_update_failures:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'

        # Collecte des pages vues : route ouverte sans jeton, qui écrit en base. La limite est
        # large (une page vue toutes les 2 s en moyenne) mais ferme la porte au remplissage massif.
        analytics_events:
            policy: sliding_window
            limit: 300
            interval: '10 minutes'

        # Parties en direct : un code PIN n'a que 6 chiffres. Seuls les codes inconnus comptent
        # (par compte), ce qui empêche de balayer les PIN sans jamais gêner un vrai joueur.
        live_game_pin_misses:
            policy: sliding_window
            limit: 10
            interval: '10 minutes'
